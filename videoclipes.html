    <title>Videoclipes - Portfolio</title>
    <script>
    (function () {
      if (window.location.protocol === 'file:') return;

      var prettyByPage = {
        'index.html': 'home',
        'publicidade.html': 'commercials',
        'videoclipes.html': 'music',
        'ficcao.html': 'narrative',
        'sobre.html': 'about'
      };

      var normalizedPath = window.location.pathname.replace(/\/+$/, '');
      var parts = normalizedPath.split('/');
      var last = String(parts.pop() || '').toLowerCase();
      var pretty = prettyByPage[last];
      if (!pretty) return;

      var base = (parts.join('/') + '/').replace(/\/+/g, '/');
      var targetPath = (base + pretty).replace(/\/+/g, '/');
      if (targetPath === window.location.pathname) return;

      window.history.replaceState({}, '', targetPath + window.location.search + window.location.hash);
    })();
    </script>
